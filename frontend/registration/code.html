<!DOCTYPE html><html class="light" lang="ru"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sapar Quest - Регистрация</title>
    <script src="../shared/language-boot.js"></script>
    <link rel="stylesheet" href="../shared/tailwind.css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <style>
      .storybook-gradient {
        background: linear-gradient(135deg, #006668, #52f2f5);
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #f7f6f2;
      }
    </style>
  </head>
  <body class="bg-surface font-body text-on-surface flex flex-col min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
    <header class="w-full top-0 px-6 py-4 bg-white/80 backdrop-blur-xl z-50 shadow-[0px_8px_24px_rgba(46,47,45,0.06)]">
      <div class="flex justify-between items-center w-full max-w-7xl mx-auto">
        <a class="text-2xl font-extrabold bg-gradient-to-br from-[#006668] to-[#52f2f5] bg-clip-text text-transparent font-headline tracking-tight" href="../home_page/code.html">
          Sapar Quest
        </a>
        <div class="flex items-center gap-4">
          <a data-i18n="nav_auth" href="./code.html" class="text-primary font-headline font-bold text-sm hover:opacity-80 transition-opacity">Регистрация</a>
        </div>
      </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 md:p-8 relative overflow-hidden">
      <div class="absolute top-10 left-10 w-64 h-64 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
      <div class="absolute bottom-10 right-10 w-72 h-72 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>

      <div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-[0_8px_24px_rgba(46,47,45,0.06)] relative z-10 overflow-hidden">
        <div class="storybook-gradient pt-12 pb-24 px-8 text-center relative">
          <h1 data-auth-hero-title="" class="font-headline text-4xl md:text-5xl font-extrabold text-surface-container-lowest tracking-tight mb-2 z-10 relative drop-shadow-md">Присоединяйся!</h1>
          <p data-auth-hero-subtitle="" class="font-body text-primary-container text-lg font-medium z-10 relative">Создай профиль исследователя и начни путешествие.</p>
        </div>

        <div data-google-section="" class="hidden px-8 pt-10 bg-surface-container-lowest rounded-t-[3rem] -mt-[3rem] relative z-20 text-center">
          <p data-i18n="google_hint" class="mb-4 text-xs font-bold uppercase tracking-widest text-on-surface-variant">или продолжить через Google</p>
          <div class="flex justify-center" data-google-button=""></div>
          <p data-google-status="" class="mt-3 hidden text-xs font-bold text-on-surface-variant"></p>
        </div>

        <form class="px-8 pt-24 pb-10 space-y-8 bg-surface-container-lowest rounded-t-[3rem] -mt-[3rem] relative z-10" data-register-form="">
          <div class="hidden w-full max-w-xl mx-auto mt-5 mb-10 rounded-2xl border border-error/20 bg-error-container/10 px-6 py-4 text-sm md:text-base leading-relaxed text-error text-left break-words" data-form-error=""></div>

          <div class="space-y-2">
            <label data-i18n="label_username" class="block font-headline font-bold text-on-surface ml-4 text-lg" for="username">Имя исследователя</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline-variant">face</span>
              </div>
              <input data-i18n-placeholder="placeholder_username" class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-14 pr-6 text-on-surface font-body placeholder:text-outline focus:bg-primary-container focus:ring-2 focus:ring-primary/20 transition-all shadow-inner" id="username" name="username" placeholder="Как тебя называть?" type="text" required="">
            </div>
          </div>

          <div class="space-y-2">
            <label data-i18n="label_email" class="block font-headline font-bold text-on-surface ml-4 text-lg" for="email">Почта</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline-variant">mail</span>
              </div>
              <input data-i18n-placeholder="placeholder_email" class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-14 pr-6 text-on-surface font-body placeholder:text-outline focus:bg-primary-container focus:ring-2 focus:ring-primary/20 transition-all shadow-inner" id="email" name="email" placeholder="email@example.com" type="email" required="">
            </div>
          </div>

          <div class="space-y-2">
            <label data-i18n="label_password" class="block font-headline font-bold text-on-surface ml-4 text-lg" for="password">Пароль</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline-variant">key</span>
              </div>
              <input data-i18n-placeholder="placeholder_password" class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-14 pr-6 text-on-surface font-body placeholder:text-outline focus:bg-primary-container focus:ring-2 focus:ring-primary/20 transition-all shadow-inner" id="password" name="password" placeholder="Минимум 4 символа" type="password" required="" minlength="4">
            </div>
          </div>

          <div class="pt-4">
            <button class="w-full bg-secondary-container text-on-secondary-container font-headline font-extrabold text-xl rounded-full py-5 px-8 shadow-[0_8px_16px_rgba(255,215,9,0.3)] hover:brightness-105 active:scale-95 transition-all flex items-center justify-center gap-3 group relative overflow-hidden" type="submit">
              <span data-i18n="register_button" class="relative z-10">Начать путешествие!</span>
              <span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 1;">explore</span>
            </button>
          </div>

          <p class="text-center font-body text-sm text-on-surface-variant mt-6">
            <span data-i18n="have_account">Уже есть аккаунт?</span> <a data-i18n="switch_login" class="text-primary font-bold underline decoration-primary/30 underline-offset-2" href="#" data-switch-to-login="">Войти</a>
          </p>
        </form>

        <form class="hidden px-8 pt-24 pb-10 space-y-8 bg-surface-container-lowest rounded-t-[3rem] -mt-[3rem] relative z-10" data-login-form="">
          <div class="hidden w-full max-w-xl mx-auto mt-5 mb-10 rounded-2xl border border-error/20 bg-error-container/10 px-6 py-4 text-sm md:text-base leading-relaxed text-error text-left break-words" data-login-error=""></div>

          <div class="space-y-2">
            <label data-i18n="label_email" class="block font-headline font-bold text-on-surface ml-4 text-lg" for="login-email">Почта</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline-variant">mail</span>
              </div>
              <input data-i18n-placeholder="placeholder_email" class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-14 pr-6 text-on-surface font-body placeholder:text-outline focus:bg-primary-container focus:ring-2 focus:ring-primary/20 transition-all shadow-inner" id="login-email" name="email" placeholder="email@example.com" type="email" required="">
            </div>
          </div>

          <div class="space-y-2">
            <label data-i18n="label_password" class="block font-headline font-bold text-on-surface ml-4 text-lg" for="login-password">Пароль</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline-variant">key</span>
              </div>
              <input data-i18n-placeholder="placeholder_login_password" class="w-full bg-surface-container-highest border-none rounded-full py-4 pl-14 pr-6 text-on-surface font-body placeholder:text-outline focus:bg-primary-container focus:ring-2 focus:ring-primary/20 transition-all shadow-inner" id="login-password" name="password" placeholder="Ваш пароль" type="password" required="">
            </div>
          </div>

          <div class="pt-4">
            <button class="w-full bg-primary text-on-primary font-headline font-extrabold text-xl rounded-full py-5 px-8 shadow-[0_8px_16px_rgba(0,102,104,0.3)] hover:bg-primary-dim active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">
              <span data-i18n="login_button">Войти</span>
              <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
            </button>
          </div>

          <p class="text-center font-body text-sm text-on-surface-variant mt-6">
            <span data-i18n="no_account">Нет аккаунта?</span> <a data-i18n="switch_register" class="text-primary font-bold underline decoration-primary/30 underline-offset-2" href="#" data-switch-to-register="">Зарегистрироваться</a>
          </p>
        </form>
      </div>
    </main>

    <footer class="mt-auto bg-[#f1f1ed] w-full py-10 rounded-t-[3rem] flex flex-col items-center gap-4 px-8 text-center relative z-20">
      <div class="flex flex-wrap justify-center gap-10 font-bold text-sm text-[#2e2f2d]/60">
        <a class="hover:text-primary transition-colors" href="../privacy/code.html">Privacy Policy</a>
        <a class="hover:text-primary transition-colors" href="../parental_guide/code.html">Parental Guide</a>
        <a class="hover:text-primary transition-colors" href="../help_center/code.html">Help Center</a>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="font-black text-[#2e2f2d] text-lg tracking-tighter">Sapar Quest</span>
        <p class="font-bold text-xs text-[#2e2f2d]/40">© 2026 Sapar Quest — Твоя живая история</p>
      </div>
    </footer>

    
    <script type="module" src="../shared/auth.js"></script>
  

</body></html>
