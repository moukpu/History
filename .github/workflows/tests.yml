name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      # Stable secret so tests never depend on the random per-process fallback
      # and avoid spurious "JWT_SECRET not configured" warnings.
      JWT_SECRET: ci-test-secret-${{ github.run_id }}-padding-padding-padding

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check every Python source
        run: python -m compileall -q main.py quiz_bank scripts tests

      - name: Review quiz bank
        run: python scripts/review_quiz_bank.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
